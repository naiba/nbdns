version: 2

before:
  hooks:
    - go mod tidy -v
builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - arm
      - arm64
      - 386
      - amd64
      - mips
      - mipsle
      - s390x
      - riscv64
    gomips:
      - softfloat
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
    main: .
    binary: nbdns
universal_binaries:
  - name_template: "nbdns"
    replace: false
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}"
archives:
  - name_template: "nbdns_{{ .Os }}_{{ .Arch }}"
    formats: ["zip"]
    files:
      - LICENSE
      - README.md
      - README_zh.md
      - doc/release-v2.0.0.md
      - doc/release-v2.0.1.md
      - doc/release-v2.0.2.md
      - doc/release-v2.0.3.md
      - doc/release-v2.0.5.md
      - doc/performance-local.md
      - doc/upstream-concurrency-performance.md
      - data
dockers_v2:
  - images:
      - "ghcr.io/naiba/{{ .ProjectName }}"
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - README.md
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.title": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore"
      - Merge pull request
      - Merge branch
      - go mod tidy

release:
  header: |
    ## {{ .Tag }} — Repair ECS refusals

    Some GeoDNS names answer REFUSED to every query that carries ECS but resolve without it; clients used to receive SERVFAIL for them. Such REFUSED replies are now retried once without ECS, remembered for 24 hours and listed with their reason in the dashboard panel. Names refused with and without ECS stay REFUSED. Existing installations may automatically install this release and restart.

    See [release notes](https://github.com/naiba/nbdns/blob/{{ .Tag }}/doc/release-v2.1.4.md). No configuration migration is required from v2.0.x. v1 configurations remain incompatible with v2.
