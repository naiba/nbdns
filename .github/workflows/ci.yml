name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test (race detector)
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Build 32-bit release targets
        # Native 64-bit checks miss dependency constants that overflow int on routers.
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARM: '6'
          GOMIPS: softfloat
        run: |
          for arch in 386 arm mips mipsle; do
            GOARCH="$arch" go build ./...
          done
